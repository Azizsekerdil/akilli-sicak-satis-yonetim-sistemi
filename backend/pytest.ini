[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -q
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    slow: takes more than a couple of seconds
    ai: requires a live AI provider (skipped by default)
    integration: exercises several modules together
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
