name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The dependency audit is worth running even when nothing changes: a clean
    # scan is a statement about a date, not about the code.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app scripts tests

      - name: Tests
        working-directory: backend
        run: python -m pytest tests/ -q --tb=short
        env:
          # Never let CI reach a provider, even if a secret is present.
          VS_LMSTUDIO_ENABLED: "false"
          VS_NVIDIA_ENABLED: "false"
          VS_CLAUDE_ENABLED: "false"

      - name: Migration round trip
        working-directory: backend
        run: |
          export VS_DATABASE_URL="sqlite:///$(pwd)/ci-migration.db"
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  integration:
    name: Full stack — tests with the frontend built
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # Ten static-file-serving tests skip unless frontend/dist exists.
      # Building it here is what makes them actually run.
      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Tests
        working-directory: backend
        run: python -m pytest tests/ -q --tb=short
        env:
          VS_LMSTUDIO_ENABLED: "false"
          VS_NVIDIA_ENABLED: "false"
          VS_CLAUDE_ENABLED: "false"

      - name: Demo seed and integrity check
        working-directory: backend
        run: |
          export VS_DATABASE_URL="sqlite:///$(pwd)/ci-demo.db"
          # The seeder raises if sum(movements) != stock_balances, so a
          # successful run is itself the stock-integrity assertion.
          python -m scripts.seed_demo_data --reset --customers 60 --months 3

  audit:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: pip-audit (runtime and dev)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
          pip-audit -r backend/requirements-dev.txt

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
